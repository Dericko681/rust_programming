name: 'Fibonacci Bot'
description: 'Calculates Fibonacci numbers from PR content.'
inputs:
  enable_fib:
    description: 'Enable Fibonacci calculation'
    required: true
    default: 'true'
  threshold:
    description: 'Threshold limit for Fibonacci calculation'
    required: false
    default: '10'
runs:
  using: 'rust'
  steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Run Rust script
      run: cargo run
